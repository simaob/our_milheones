version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Same window as `cooldown: 14` on the Gemfile source. GitHub never applies cooldown to
  # security updates, so those still arrive as soon as a fix ships.
  cooldown:
    default-days: 14
  ignore:
    # The bet pickers rely on select2 3.x (see the Gemfile). Upgrading is tracked in issue #9;
    # remove this rule when that's done.
    - dependency-name: select2-rails
      versions: [">= 4"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 14
