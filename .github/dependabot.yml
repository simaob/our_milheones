version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Same window as `cooldown: 14` on the Gemfile source. GitHub never applies cooldown to
  # security updates, so those still arrive as soon as a fix ships.
  cooldown:
    default-days: 14
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 14
