# Recurring tasks run by the Solid Queue scheduler (inside Puma in production,
# see SOLID_QUEUE_IN_PUMA in config/deploy.yml). This replaces the old
# `whenever` cron schedule (config/schedule.rb).
#
# Schedules are parsed by Fugit and are pinned to Lisbon time so they don't
# depend on the container's clock (UTC).

production:
  new_current_week:
    class: NewCurrentWeekJob
    schedule: every monday at 9am Europe/Lisbon

  # Two days before the last day of the month ("-3" is the third-to-last day):
  # 28 Nov, 29 Dec, 29 Jan, 26 Feb, 29 Mar... See test/jobs/monthly_bets_reminder_job_test.rb.
  monthly_bets_reminder:
    class: MonthlyBetsReminderJob
    schedule: "0 9 -3 * * Europe/Lisbon"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
